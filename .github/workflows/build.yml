name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publicar GitHub Release con MediaTagsSetup.exe"
        type: boolean
        default: true
      tag:
        description: "Tag de la release (se crea o se reutiliza)"
        type: string
        default: "v1.0.9"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore WebView2
        run: nuget restore Project1\packages.config -PackagesDirectory Project1\packages

      - name: Verify WebView2 and SDK tools
        shell: pwsh
        run: |
          $header = "Project1\packages\Microsoft.Web.WebView2.1.0.4191.47\build\native\include\WebView2.h"
          if (-not (Test-Path $header)) {
            Write-Host "Contenido de Project1\packages:"
            Get-ChildItem Project1\packages -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "No se restauró WebView2.h"
          }

          $kitBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          Write-Host "Windows SDK bin: $kitBin exists=$(Test-Path $kitBin)"
          Get-ChildItem $kitBin -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem (Join-Path $kitBin "*\x64\makeappx.exe") -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "makeappx: $($_.FullName)" }
          Get-ChildItem (Join-Path $kitBin "*\x64\signtool.exe") -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "signtool: $($_.FullName)" }

      - name: Build Release x64
        shell: cmd
        run: msbuild.exe Setup\Setup.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SkipPackage=true /v:minimal /fl /flp:"logfile=msbuild.log;verbosity=normal"

      - name: Package installer
        shell: pwsh
        run: |
          $stub = "Setup\obj\x64\Release\MediaTagsSetup.stub.exe"
          if (-not (Test-Path $stub)) {
            throw "No está el stub $stub"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "Package\build-installer.ps1" -Configuration Release -Platform x64 -Stub (Resolve-Path $stub)
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            throw "build-installer.ps1 falló con código $LASTEXITCODE"
          }
          $setup = "out\x64\Release\MediaTagsSetup.exe"
          if (-not (Test-Path $setup)) {
            throw "No se generó $setup"
          }

      - name: Stage installer
        shell: pwsh
        run: |
          $src = "out\x64\Release\MediaTagsSetup.exe"
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and "${{ inputs.tag }}") {
            "${{ inputs.tag }}".TrimStart("v")
          } else {
            "dev"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $src "dist\MediaTagsSetup.exe"
          Copy-Item $src "dist\MediaTagsSetup-$version.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaTagsSetup
          path: |
            dist/MediaTagsSetup.exe
            dist/MediaTagsSetup-*.exe
          if-no-files-found: error

      - name: Upload MSBuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            dist/MediaTagsSetup.exe
            dist/MediaTagsSetup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Descarga **MediaTagsSetup.exe**, ejecútalo y acepta el UAC. Windows 10/11 **64 bits**. [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) suele venir con Edge.

            Desinstalar: *Configuración → Aplicaciones*, o el mismo instalador con `/uninstall`.

            Si Defender marca el archivo (`Trojan:Win32/Bearfoos.Alml`), restáuralo o permítelo: falso positivo heurístico conocido (instalador autofirmado).

            ---

            Download **MediaTagsSetup.exe**, run it and accept UAC. Windows 10/11 **64-bit**. [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) is usually already installed with Edge.

            Uninstall from *Settings → Apps*, or run the same installer with `/uninstall`.

            If Defender flags the file (`Trojan:Win32/Bearfoos.Alml`), restore or allow it: known heuristic false positive (self-signed installer).
