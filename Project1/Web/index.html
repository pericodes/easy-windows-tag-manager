<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control"
          content="no-store">
    <title>Gestionar tags</title>

    <link rel="stylesheet"
          href="style.css?v=3">
</head>

<body>

<div class="window">

    <h1>Gestionar tags</h1>

    <div id="fileCount"
         class="subtitle">
    </div>

    <div class="section-header">

        <h2>Tags comunes</h2>

        <button id="add"
                class="primary">
            Añadir
        </button>

    </div>

    <div id="tags"
         class="tags">
    </div>

    <div id="otherSection"
         class="hidden">

        <h2>Otros tags</h2>

        <div id="otherTags"
             class="tags other-tags">
        </div>

    </div>

</div>


<div id="modal"
     class="modal hidden">

    <div class="dialog">

        <h2>Añadir tag</h2>

        <input id="newTag"
               type="text"
               autocomplete="off"
               placeholder="Escribe un tag">

        <div class="dialog-buttons">

            <button id="cancel">
                Cancelar
            </button>

            <button id="confirmAdd"
                    class="primary">
                Añadir
            </button>

        </div>

    </div>

</div>


<script src="app.js?v=3"></script>

</body>
</html>
