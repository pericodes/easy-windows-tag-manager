<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control"
          content="no-store">
    <title>Manage tags</title>

    <link rel="stylesheet"
          href="style.css">

    <script>
        if (new URLSearchParams(location.search).get("library") === "0")
            document.documentElement.classList.add("library-off");
    </script>
</head>

<body>

<div class="window">

    <div class="title-row">

        <div class="title-heading">
            <img class="app-logo"
                 src="logo.png"
                 alt=""
                 width="32"
                 height="32">
            <h1 data-i18n="manageTags">Manage tags</h1>
        </div>

        <div class="title-tools">

            <button id="libraryToggle"
                    type="button"
                    class="library-toggle is-on"
                    aria-pressed="true"
                    data-i18n="savedTags">
                Saved
            </button>

            <label class="lang-picker">
                <select id="lang"
                        aria-label="Language">
                    <option value="auto">Windows</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </label>

        </div>

    </div>

    <div id="fileCount"
         class="subtitle">
    </div>

    <div id="status"
         class="status hidden">
    </div>

    <div class="columns">

    <div class="column-main">

    <div class="section-header">

        <h2 data-i18n="commonTags">Common tags</h2>

        <button id="add"
                class="primary"
                data-i18n="add">
            Add
        </button>

    </div>

    <div id="tags"
         class="tags">
    </div>

    <div id="otherSection"
         class="hidden">

        <h2 data-i18n="otherTags">Other tags</h2>

        <div id="otherTags"
             class="tags other-tags">
        </div>

    </div>

    </div>

    <aside id="library"
           class="column-library">

        <div class="section-header">

            <h2 data-i18n="savedTags">Saved</h2>

            <button id="addSaved"
                    class="primary"
                    data-i18n="add">
                Add
            </button>

        </div>

        <div id="savedTags"
             class="tags">
        </div>

        <div id="recentSection"
             class="hidden">

            <h2 data-i18n="recentTags">Recently used</h2>

            <div id="recentTags"
                 class="tags">
            </div>

        </div>

    </aside>

    </div>

</div>


<div id="modal"
     class="modal hidden">

    <div class="dialog">

        <h2 id="modalTitle"
            data-i18n="addTag">Add tag</h2>

        <input id="newTag"
               type="text"
               autocomplete="off"
               data-i18n-placeholder="placeholder"
               placeholder="Type a tag">

        <div class="dialog-buttons">

            <button id="cancel"
                    data-i18n="cancel">
                Cancel
            </button>

            <button id="confirmAdd"
                    class="primary"
                    data-i18n="add">
                Add
            </button>

        </div>

    </div>

</div>


<div id="busy"
     class="busy"
     role="status"
     aria-live="polite">

    <div class="busy-card">

        <div class="spinner"
             aria-hidden="true"></div>

        <p id="busyText"
           data-i18n="loading">Loading tags…</p>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
