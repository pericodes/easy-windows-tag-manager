<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control"
          content="no-store">
    <title>Manage tags</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<div class="window">

    <div class="title-row">

        <div class="title-heading">
            <img class="app-logo"
                 src="logo.png"
                 alt=""
                 width="32"
                 height="32">
            <h1 data-i18n="manageTags">Manage tags</h1>
        </div>

        <label class="lang-picker">
            <select id="lang"
                    aria-label="Language">
                <option value="auto">Windows</option>
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </label>

    </div>

    <div id="fileCount"
         class="subtitle">
    </div>

    <div class="section-header">

        <h2 data-i18n="commonTags">Common tags</h2>

        <button id="add"
                class="primary"
                data-i18n="add">
            Add
        </button>

    </div>

    <div id="tags"
         class="tags">
    </div>

    <div id="otherSection"
         class="hidden">

        <h2 data-i18n="otherTags">Other tags</h2>

        <div id="otherTags"
             class="tags other-tags">
        </div>

    </div>

</div>


<div id="modal"
     class="modal hidden">

    <div class="dialog">

        <h2 data-i18n="addTag">Add tag</h2>

        <input id="newTag"
               type="text"
               autocomplete="off"
               data-i18n-placeholder="placeholder"
               placeholder="Type a tag">

        <div class="dialog-buttons">

            <button id="cancel"
                    data-i18n="cancel">
                Cancel
            </button>

            <button id="confirmAdd"
                    class="primary"
                    data-i18n="add">
                Add
            </button>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
